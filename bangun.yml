# Membangun aplikasi CBT Ujian: Android (.apk) dan Windows (.exe).
# Jalankan dari tab Actions → "Bangun aplikasi CBT Ujian" → Run workflow → isi alamat yang dibuka aplikasi.
# Hasil: bagian "Artifacts" di halaman hasil (CBT-Ujian-android berisi .apk, CBT-Ujian-windows berisi .exe).
# Ikon kedua aplikasi dibuat otomatis dari logo.png (di akar repo) oleh buat-ikon.py.
# Sebelum membangun, alamat & kunci link (secret APP_KUNCI) dicocokkan dulu dengan server ujian. Bila tidak cocok,
# pembangunan dihentikan dengan pesan yang jelas, jadi aplikasi yang pasti ditolak server tidak pernah dibagikan.
name: Bangun aplikasi CBT Ujian

on:
  workflow_dispatch:
    inputs:
      alamat:
        description: "Alamat yang dibuka aplikasi: link blog sekolah (contoh: https://namasekolah.blogspot.com) atau https://…/ujian-cbt/"
        required: true
        type: string

permissions:
  contents: read

jobs:
  periksa:
    name: Periksa alamat & kunci link
    runs-on: ubuntu-latest
    steps:
      - name: Cocokkan dengan server ujian
        env:
          ALAMAT: ${{ inputs.alamat }}
          APP_KUNCI: ${{ secrets.APP_KUNCI }}
        run: |
          A="$(printf '%s' "$ALAMAT" | tr -d '[:space:]')"
          K="$(printf '%s' "$APP_KUNCI" | tr -d '[:space:]')"
          case "$A" in
            https://*) ;;
            *) echo "::error::Alamat harus diawali https:// (sekarang: $A)"; exit 1 ;;
          esac
          case "$A" in
            *"/ujian-cbt"*) ;;
            *) echo "::notice::Alamat bukan …/ujian-cbt/ (mis. link blog sekolah): kecocokan kunci link tidak bisa diperiksa di sini."; exit 0 ;;
          esac
          UA="Mozilla/5.0 (Linux) CBTUjian/periksa (Linux)"
          [ -n "$K" ] && UA="$UA k/$K"
          kode=$(curl -sL -o halaman.html -w '%{http_code}' --max-time 40 -A "$UA" "$A" || true)
          tanpa=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 40 -A "Mozilla/5.0 (Linux)" "$A" || true)
          if [ "$kode" = "200" ]; then
            if [ "$tanpa" = "200" ]; then
              echo "::warning::Server menerima halaman ujian tanpa kunci link (Kunci link OFF di Pengaturan, atau APP_KUNCI di serverC kosong). Aplikasi tetap bisa dipakai."
            fi
            echo "Alamat & kunci link cocok dengan server: $A"
            exit 0
          fi
          if [ "$kode" = "000" ]; then echo "::error::Alamat $A tidak bisa dihubungi. Periksa ejaan alamat."; exit 1; fi
          if [ "$kode" = "404" ] && grep -q "Kode K0" halaman.html; then
            echo "::error::Secret APP_KUNCI di repo ini belum diisi, padahal server memakai kunci link. Isi Settings → Secrets and variables → Actions → APP_KUNCI sama persis dengan APP_KUNCI di serverC, lalu jalankan lagi."; exit 1
          fi
          if [ "$kode" = "404" ] && grep -q "Kode K1" halaman.html; then
            echo "::error::Kunci link tidak cocok: secret APP_KUNCI di repo ini BERBEDA dengan APP_KUNCI di serverC. Samakan keduanya (tempel tanpa spasi/enter), lalu jalankan lagi."; exit 1
          fi
          if [ "$kode" = "404" ]; then echo "::error::Halaman $A tidak ditemukan (404). Pastikan alamat diakhiri /ujian-cbt/ dan server sudah versi 2.19.1 atau lebih baru."; exit 1; fi
          echo "::error::Server menjawab kode $kode untuk $A."; exit 1

  android:
    name: Android (.apk)
    needs: periksa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat ikon aplikasi dari logo.png
        run: |
          pip install --quiet pillow numpy
          python buat-ikon.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK (sudah terpasang di mesin GitHub)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          ls "$SDK/platforms" || true
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
          fi
          echo "sdk.dir=$SDK" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Kunci tanda tangan APK (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cbt-ujian.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/cbt-ujian.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi. APK ditandatangani kunci sementara: untuk memasang versi berikutnya, aplikasi lama harus dihapus dulu."
          fi

      - name: Bangun APK
        env:
          ALAMAT: ${{ inputs.alamat }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_KUNCI: ${{ secrets.APP_KUNCI }}
        run: gradle -p android assembleRelease "-PalamatUjian=$ALAMAT" "-PappKunci=$APP_KUNCI" --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk CBT-Ujian.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CBT-Ujian-android
          path: CBT-Ujian.apk

  windows:
    name: Windows (.exe)
    needs: periksa
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat ikon aplikasi dari logo.png
        run: |
          pip install --quiet pillow numpy
          python buat-ikon.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Bangun EXE
        shell: pwsh
        env:
          ALAMAT: ${{ inputs.alamat }}
          APP_KUNCI: ${{ secrets.APP_KUNCI }}
        run: dotnet build windows/CBTUjian.csproj -c Release "-p:AlamatUjian=$env:ALAMAT" "-p:AppKunci=$env:APP_KUNCI"

      - name: Ambil exe
        shell: pwsh
        run: Copy-Item windows/bin/Release/net48/CBT-Ujian.exe CBT-Ujian.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CBT-Ujian-windows
          path: CBT-Ujian.exe
